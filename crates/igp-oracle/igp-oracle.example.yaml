marketData:
  provider: coingecko
  cacheTtlSeconds: 60
  staleAfterSeconds: 300
  assets:
    arbitrum: ethereum
    celestiatestnet: celestia
    edentestnet: ethereum
    ethereum: ethereum
    sepolia: ethereum

defaults:
  minBpsChangeToWrite: 500
  maxBpsChangePerUpdate: 5000
  cooldownSeconds: 900
  safetyMultiplierBps: 11000
  gasSampleFreshnessSeconds: 120

targets:
  - originChain: celestiatestnet
    remoteSelection: configuredOnOriginIgp
    enabled: true
    gas:
      mode: sample
      source: rpc
      min: "1"
      max: "1000000000000"
    exchangeRate:
      min: "1"
      max: "1000000000000000"
    write:
      enabled: true
      method: celestia-grpc
      signerProfile: celestia-owner

  # EVM IGP destination configs are not enumerable through ordinary contract
  # reads. Use an explicit domain list for multi-domain EVM-origin dry runs, or
  # keep configuredOnOriginIgp and pass --remote-chain/--remote-domain for a
  # one-off direct read.
  # - originChain: ethereum
  #   remoteSelection:
  #     domains:
  #       - 1128614981
  #       - 42161
  #   enabled: false
  #   gas:
  #     mode: preserve
  #     source: rpc
  #     min: "1"
  #     max: "1000000000000"
  #   exchangeRate:
  #     min: "1"
  #     max: "1000000000000000000000000000"
  #   write:
  #     enabled: false
  #     method: evm
  #     signerProfile: ethereum-owner

signers:
  celestia-owner:
    protocol: cosmosnative
    from: owner
    keyEnv: HYP_KEY_COSMOSNATIVE
